<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Futurista</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
        }
        
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }
        
        .sidebar {
            width: 280px;
            background: #2d3748;
            color: white;
            padding: 20px;
            overflow-y: auto;
        }
        
        .sidebar h1 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #667eea;
        }
        
        .btn-novo {
            width: 100%;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        
        .btn-novo:hover {
            background: #764ba2;
        }
        
        .chat-list {
            margin-bottom: 20px;
        }
        
        .chat-item {
            padding: 10px;
            background: #1a202c;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 13px;
        }
        
        .chat-item:hover {
            background: #2d3748;
        }
        
        .chat-item.active {
            background: #667eea;
        }
        
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f7fafc;
        }
        
        .header {
            background: white;
            padding: 20px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h2 {
            font-size: 24px;
            color: #2d3748;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #718096;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            background: #48bb78;
            border-radius: 50%;
        }
        
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .message {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .message.ai {
            justify-content: flex-start;
        }
        
        .message-bubble {
            max-width: 60%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .message.user .message-bubble {
            background: #667eea;
            color: white;
        }
        
        .message.ai .message-bubble {
            background: white;
            color: #2d3748;
            border: 1px solid #e2e8f0;
        }
        
        .input-area {
            background: white;
            border-top: 1px solid #e2e8f0;
            padding: 15px 20px;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        
        .input-group {
            flex: 1;
            display: flex;
            gap: 10px;
        }
        
        .input-group input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .btn-send {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
        }
        
        .btn-send:hover {
            background: #764ba2;
        }
        
        .btn-send:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #718096;
            font-size: 13px;
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e2e8f0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }
        
        .tab-btn {
            padding: 8px 16px;
            background: #edf2f7;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }
        
        .tab-btn.active {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <h1>🤖 IA Futurista</h1>
            <button class="btn-novo" onclick="novoChat()">+ Novo Chat</button>
            
            <div>
                <h3 style="font-size: 12px; color: #a0aec0; margin-bottom: 10px; text-transform: uppercase;">Histórico</h3>
                <div class="chat-list" id="chatList">
                    <div class="chat-item active" onclick="selecionarChat(0)">Chat Principal</div>
                </div>
            </div>
            
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="abaAgente()">🤖 Agente</button>
                <button class="tab-btn" onclick="abaAutomacao()">⚙️ Auto</button>
            </div>
        </div>
        
        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <div class="header">
                <h2>IA Futurista - Agente</h2>
                <div class="status">
                    <div class="status-dot"></div>
                    <span>Online - Ollama Conectado</span>
                </div>
            </div>
            
            <!-- Chat Area -->
            <div class="chat-area" id="chatArea">
                <div class="message ai">
                    <div class="message-bubble">
                        Olá! Sou a IA Futurista. Como posso ajudar você hoje?
                    </div>
                </div>
            </div>
            
            <!-- Input Area -->
            <div class="input-area">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="inputMsg" 
                        placeholder="Digite sua mensagem..."
                        onkeypress="if(event.key==='Enter') enviarMsg()"
                    >
                </div>
                <button class="btn-send" onclick="enviarMsg()" id="btnEnviar">Enviar</button>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = 'http://localhost:8742';
        let sessaoId = null;
        
        // Inicializar
        async function inicializar() {
            try {
                const res = await fetch(`${API_URL}/api/status`);
                const data = await res.json();
                console.log('IA Futurista Online:', data);
            } catch (e) {
                console.error('Erro ao conectar:', e);
                adicionarMensagem('IA', '⚠️ Erro ao conectar com o servidor. Verifique se a IA está rodando na porta 8742.');
            }
        }
        
        async function enviarMsg() {
            const input = document.getElementById('inputMsg');
            const msg = input.value.trim();
            
            if (!msg) return;
            
            // Adicionar mensagem do usuário
            adicionarMensagem('user', msg);
            input.value = '';
            document.getElementById('btnEnviar').disabled = true;
            
            // Mostrar loading
            adicionarMensagem('ai', '<div class="spinner"></div> Pensando...');
            
            try {
                const res = await fetch(`${API_URL}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        mensagem: msg,
                        sessao_id: sessaoId,
                        modelo: 'qwen2.5-coder:7b'
                    })
                });
                
                const data = await res.json();
                
                // Remover loading
                const chatArea = document.getElementById('chatArea');
                chatArea.removeChild(chatArea.lastChild);
                
                // Adicionar resposta
                const resposta = data.resposta?.content || data.resposta || 'Sem resposta';
                adicionarMensagem('ai', resposta);
                
                if (!sessaoId) {
                    sessaoId = data.sessao_id;
                }
            } catch (e) {
                console.error('Erro:', e);
                adicionarMensagem('ai', '❌ Erro ao processar. Tente novamente.');
            } finally {
                document.getElementById('btnEnviar').disabled = false;
                document.getElementById('inputMsg').focus();
            }
        }
        
        function adicionarMensagem(tipo, texto) {
            const chatArea = document.getElementById('chatArea');
            const div = document.createElement('div');
            div.className = `message ${tipo === 'user' ? 'user' : 'ai'}`;
            div.innerHTML = `<div class="message-bubble">${texto}</div>`;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        function novoChat() {
            sessaoId = null;
            document.getElementById('chatArea').innerHTML = '';
            adicionarMensagem('ai', 'Novo chat iniciado. Como posso ajudar?');
        }
        
        function selecionarChat(idx) {
            document.querySelectorAll('.chat-item').forEach((el, i) => {
                el.classList.toggle('active', i === idx);
            });
        }
        
        function abaAgente() {
            alert('🤖 Aba Agente - Chat com IA multiagente');
        }
        
        function abaAutomacao() {
            alert('⚙️ Aba Automação - Criar e gerenciar tarefas automatizadas');
        }
        
        // Inicializar na carga
        window.onload = inicializar;
    </script>
</body>
</html>
