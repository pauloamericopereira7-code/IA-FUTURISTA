<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>IDE — IA Futurista</title>
  <style>
    body { margin:0; background:#1e1e1e; color:#ccc; font-family:Consolas,monospace; }
    .bar { background:#323233; padding:8px 16px; font-size:13px; }
    textarea { width:100%; height:calc(100vh - 120px); background:#1e1e1e; color:#d4d4d4; border:none; padding:16px; font-size:14px; resize:none; outline:none; }
    .term { background:#0d0d0d; padding:12px; height:80px; font-size:12px; border-top:1px solid #333; }
  </style>
</head>
<body>
  <div class="bar">🖥️ IDE — IA Futurista</div>
  <textarea id="code"># Editor integrado — peça ao agente no chat principal</textarea>
  <div class="term" id="term">Terminal pronto.</div>
</body>
</html>
