<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Íris</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="menubar">
    <span>Arquivo</span><span>Editar</span><span>Visualizar</span><span>Ajuda</span>
  </div>

  <div class="shell">
    <aside class="sidebar">
      <div class="brand-row">
        <div class="brand-mark">Í</div>
        <div><strong>Íris</strong><small>Assistente local</small></div>
      </div>
      <div class="sidebar-nav">
        <button class="nav-item" id="btn-new-chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          Nova conversa
        </button>
      </div>

      <div class="section-label">Conversas</div>
      <div class="chat-history" id="chat-history"></div>

      <div class="sidebar-bottom">
        <div class="pc-access">
          <label class="pc-access-label" for="pc-access-toggle">
            <input id="pc-access-toggle" type="checkbox" />
            <span>Controle do computador</span>
          </label>
          <span class="pc-access-status" id="pc-access-status">Conferindo conexão...</span>
        </div>
        <div class="system-state">
          <span class="status-indicator" id="status-indicator"></span>
          <span id="capability-status">Verificando modelos...</span>
        </div>
        <div class="user-row">
          <div class="avatar" id="user-avatar">PA</div>
          <span>Paulo Americo</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="header">
        <div class="header-title" id="chat-title">Nova conversa</div>
        <div class="header-right">
          <span class="model-badge" id="model-label">Ollama</span>
          <button class="ide-btn" onclick="window.open('/static/ide.html','_blank')">Abrir IDE ↗</button>
        </div>
      </header>

      <div class="chat-scroll" id="chat-scroll">
        <div class="chat-inner" id="chat-messages"></div>
      </div>

      <div class="input-area">
        <div class="attachment-preview" id="attachment-preview" hidden>
          <img id="attachment-image" alt="Imagem selecionada" />
          <span id="attachment-name"></span>
          <button class="remove-attachment" id="remove-attachment" type="button" title="Remover imagem">×</button>
        </div>
        <div class="agent-row">
          <label for="agent-select">Agente</label>
          <select id="agent-select">
            <option value="auto">Automático</option>
            <option value="geral">Geral</option>
            <option value="programacao">Programação</option>
            <option value="pesquisa">Pesquisa na web</option>
            <option value="visao">Análise de imagem</option>
            <option value="automacao">Automação</option>
            <option value="design">Design de interface</option>
            <option value="dados">Análise de dados</option>
            <option value="escrita">Escrita e revisão</option>
            <option value="suporte_windows">Suporte Windows</option>
          </select>
        </div>
        <div class="input-box">
          <input id="image-input" type="file" accept="image/png,image/jpeg,image/webp" hidden />
          <button class="attach-btn" id="btn-image" type="button" title="Anexar imagem" aria-label="Anexar imagem">+</button>
          <textarea id="chat-input" rows="1" placeholder="Mensagem para Íris"></textarea>
          <button class="send-btn" id="btn-send" type="button" title="Enviar mensagem" aria-label="Enviar mensagem">↑</button>
        </div>
      </div>

      <div class="footer-bar">
        <div class="footer-left">
          <span id="cloud-status">Local</span>
        </div>
        <div class="footer-right"><span>Suas conversas ficam nesta sessão</span></div>
      </div>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
